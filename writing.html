<section class="model-card">
  <div class="controls">
    <label>
      Starting price
      <input id="startPrice" type="number" value="50">
    </label>

    <label>
      Daily volatility
      <input id="volatility" type="range" min="0.005" max="0.08" step="0.005" value="0.02">
      <span id="volLabel">2.0%</span>
    </label>

    <button onclick="simulate()">Simulate again</button>
  </div>

  <div id="graph"></div>
</section>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<script>
  const volInput = document.getElementById("volatility");
  const volLabel = document.getElementById("volLabel");

  volInput.addEventListener("input", () => {
    volLabel.textContent = `${(volInput.value * 100).toFixed(1)}%`;
  });

  function randomNormal() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function simulate() {
    const startPrice = Number(document.getElementById("startPrice").value);
    const volatility = Number(document.getElementById("volatility").value);

    const steps = 252;
    const paths = 100;
    const x = Array.from({ length: steps }, (_, i) => i);

    const traces = [];

    for (let p = 0; p < paths; p++) {
      const y = [startPrice];

      for (let t = 1; t < steps; t++) {
        const randomReturn = randomNormal() * volatility;
        y.push(y[t - 1] * (1 + randomReturn));
      }

      traces.push({
        x: x,
        y: y,
        mode: "lines",
        type: "scatter",
        line: { width: 1 },
        opacity: 0.35,
        hoverinfo: "skip",
        showlegend: false
      });
    }

    Plotly.newPlot("graph", traces, {
      margin: { t: 20, r: 20, b: 40, l: 50 },
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(255,247,230,0.35)",
      xaxis: { title: "Day" },
      yaxis: { title: "Price" }
    }, {
      responsive: true
    });
  }

  simulate();
</script>
